version: '3.8'

services:
  db:
    image: mysql:8.3.0
    container_name: mysql_test_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE: meu_banco_producao
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
