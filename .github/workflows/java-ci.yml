name: Java CI

on:
  push:
    branches: [main]
    paths:
      - "projetos/hello-world-api/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    paths:
      - "projetos/hello-world-api/**"
      - ".github/workflows/java-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Spring Boot tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetos/hello-world-api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: projetos/hello-world-api/pom.xml

      - name: Run tests
        run: ./mvnw --batch-mode verify
